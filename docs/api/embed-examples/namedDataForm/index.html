    <body>
        <a class="back-link" href="../">← All embedding examples</a>
        <h1>Named data with dynamic updates</h1>
        <p>
            Initial data is declared in the specification. Form changes update
            it through the embed API's <code>datasets.set</code> method.
        </p>

        <div id="container" class="visualization-surface"></div>

        <form id="form" class="form-surface">
            <p>Change the text to update data dynamically:</p>
            <div>
                <label for="A">A:</label>
                <input type="text" id="A" value="Hello" />
            </div>
            <div>
                <label for="B">B:</label>
                <input type="text" id="B" value="World" />
            </div>
        </form>

    </body>
